            currentPage: 1,
            pageSize: 20,
            pageWindowSize: 10,
            pageWindowStart: 1,
            searchQuery: '',
            categoryFilter: 'all',
            chartScope: 'all',
            stockListMode: 'all',
            editingItemKey: ''
        };

        const overviewContainer = document.getElementById('stok-overview');
        const donutElement = document.getElementById('stok-donut');
        const legendElement = document.getElementById('stok-legend');
        const lowStockList = document.getElementById('stok-low-stock-list');
        const activityList = document.getElementById('stok-activity-list');
        const searchInput = document.getElementById('stock-search-input');
        const searchButton = document.getElementById('stock-search-button');
        const resetButton = document.getElementById('stock-search-reset');
        const categoryFilter = document.getElementById('stock-category-filter');
        const categoryScope = document.getElementById('stok-category-scope');
        const messageBox = document.getElementById('stock-search-message');
        const tableWrapper = document.getElementById('stock-table-wrapper');
        const tableInfo = document.getElementById('stock-table-info');
        const pagination = document.getElementById('stock-pagination');
        const stockListModeLabel = document.getElementById('stock-list-mode-label');
        const addItemButton = document.getElementById('stock-add-item-button');
        const addItemModal = document.getElementById('stok-add-item-modal');
        const addItemCloseButton = document.getElementById('stok-add-item-close');
        const addItemCancelButton = document.getElementById('stok-add-item-cancel');
        const addItemForm = document.getElementById('stok-add-item-form');
        const addItemError = document.getElementById('stok-add-item-error');
        const addItemNameInput = document.getElementById('stok-add-item-name');
        const addItemCodeInput = document.getElementById('stok-add-item-code');
        const addItemBarcodeInput = document.getElementById('stok-add-item-barcode');
        const addItemLocationInput = document.getElementById('stok-add-item-location');
        const addItemCategoryInput = document.getElementById('stok-add-item-category');
        const addItemStockInput = document.getElementById('stok-add-item-stock');
        const addItemCostInput = document.getElementById('stok-add-item-cost');
        const addItemPriceInput = document.getElementById('stok-add-item-price');
        const editModal = document.getElementById('stok-edit-modal');
        const editCloseButton = document.getElementById('stok-edit-close');
        const editCancelButton = document.getElementById('stok-edit-cancel');
        const editForm = document.getElementById('stok-edit-form');
        const editQuantityInput = document.getElementById('stok-edit-quantity');
        const editDetail = document.getElementById('stok-edit-detail');
        const editSummary = document.getElementById('stok-edit-summary');
        const editError = document.getElementById('stok-edit-error');

        const chartColors = ['#61c28b', '#ff7a33', '#f5c247', '#8b7be0', '#6da9e4', '#ef8fbb', '#4dc3c7', '#b89b7f'];

        const formatRupiah = (angka) => {
            if (!angka || isNaN(angka)) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        };

        const escapeHtml = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        const formatNumber = (value) => new Intl.NumberFormat('id-ID').format(Number(value || 0));

        const getStockListModeLabel = () => {
            if (state.stockListMode === 'low') {
                return 'Menampilkan daftar barang untuk kategori stok menipis.';
            }

            if (state.stockListMode === 'out') {
                return 'Menampilkan daftar barang untuk kategori stok habis.';
            }

            return 'Menampilkan semua daftar barang.';
        };

        const syncStockListModeLabel = () => {
            stockListModeLabel.textContent = getStockListModeLabel();
        };

        const getCategoryLabel = (item) => {
            const rawCategory = String(item.__kategori || '').split(' / ')[0].trim();
            if (rawCategory) {
                return rawCategory;
            }
            return String(item.__lokasi || 'Lainnya').trim() || 'Lainnya';
        };

        const getStatusClass = (stock) => {
            const value = Number(stock || 0);
            if (value <= 5) return 'low';
            if (value <= 20) return 'medium';
            return 'high';
        };

        const getStockBadge = (stock) => {
            const value = Number(stock || 0);
            const className = getStatusClass(value);
            return `<span class="stok-pill ${className}">Stok: ${escapeHtml(String(value))}</span>`;
        };

        const setMessage = (message, type = 'success') => {
            messageBox.className = `stok-message ${type}`;
            messageBox.textContent = message;
        };

        const clearMessage = () => {
            messageBox.className = 'stok-message';
            messageBox.textContent = '';
        };

        const setEditError = (message = '') => {
            editError.textContent = message;
            editError.className = message ? 'stok-edit-error active' : 'stok-edit-error';
        };

        const setAddItemError = (message = '') => {
            addItemError.textContent = message;
            addItemError.className = message ? 'stok-edit-error active' : 'stok-edit-error';
        };

        const getItemByKey = (itemKey) => state.items.find((item) => item.__itemKey === itemKey);

        const closeEditStockModal = () => {
            state.editingItemKey = '';
            editModal.classList.remove('is-open');
            editModal.setAttribute('aria-hidden', 'true');
            setEditError('');
            editForm.reset();
        };

        const openAddItemModal = () => {
            addItemModal.classList.add('is-open');
            addItemModal.setAttribute('aria-hidden', 'false');
            setAddItemError('');
            addItemForm.reset();
            addItemStockInput.value = '0';
            addItemCostInput.value = '0';
            addItemPriceInput.value = '0';
            addItemNameInput.focus();
        };

        const closeAddItemModal = () => {
            addItemModal.classList.remove('is-open');
            addItemModal.setAttribute('aria-hidden', 'true');
            setAddItemError('');
            addItemForm.reset();
        };

        const openEditStockModal = (itemKey) => {
            const item = getItemByKey(itemKey);
            if (!item) {
                setMessage('Barang yang ingin diedit tidak ditemukan.', 'error');
                return;
            }

            state.editingItemKey = itemKey;
            editDetail.innerHTML = `<strong>${escapeHtml(item.namaItem || '-')}</strong><br>${escapeHtml(item.__path || '-')}<br>Kode: ${escapeHtml(item.kodeItem || '-')} | Barcode: ${escapeHtml(item.barcode || '-')}`;
            editSummary.textContent = `Stok awal ${formatNumber(item.stokAwal || 0)} • Terjual ${formatNumber(item.stokTerjual || 0)} • Penyesuaian lokal ${formatNumber(item.stokTambahan || 0)}`;
            editQuantityInput.value = String(Number(item.currentStock || 0));
            setEditError('');
            editModal.classList.add('is-open');
            editModal.setAttribute('aria-hidden', 'false');
            editQuantityInput.focus();
            editQuantityInput.select();
        };

        const buildTopProduct = (transactions) => {
            const byItem = {};
            transactions.forEach((transaction) => {
                transaction.items.forEach((item) => {
                    if (!byItem[item.itemKey]) {
                        byItem[item.itemKey] = {
                            namaItem: item.namaItem,
                            qty: 0
                        };
                    }
                    byItem[item.itemKey].qty += Number(item.qty || 0);
                });
            });

            return Object.values(byItem).sort((left, right) => right.qty - left.qty)[0] || null;
        };

        const buildCategoryStats = (items) => {
            const totals = items.reduce((result, item) => {
                const key = getCategoryLabel(item);
                result[key] = (result[key] || 0) + 1;
                return result;
            }, {});

            return Object.entries(totals)
                .map(([name, count], index) => ({
                    name,
                    count,
                    color: chartColors[index % chartColors.length]
                }))
                .sort((left, right) => right.count - left.count);
        };

        const getFilteredItems = () => {
            const keyword = state.searchQuery.toLowerCase().trim();
            return state.items.filter((item) => {
                const stockValue = Number(item.currentStock || 0);

                if (state.stockListMode === 'low' && !(stockValue > 0 && stockValue <= 5)) {
                    return false;
                }

                if (state.stockListMode === 'out' && stockValue > 0) {
                    return false;
                }

                if (state.categoryFilter !== 'all' && getCategoryLabel(item) !== state.categoryFilter) {
                    return false;
                }

                if (!keyword) {
                    return true;
                }

                const searchable = [
                    item.namaItem,
                    item.kodeItem,
                    item.barcode,
                    item.__lokasi,
                    item.__kategori,
                    item.__path
                ].join(' ').toLowerCase();

                return searchable.includes(keyword);
            });
        };

        const renderOverview = () => {
            const lowStockItems = state.items.filter((item) => Number(item.currentStock || 0) > 0 && Number(item.currentStock || 0) <= 5);
            const outOfStockItems = state.items.filter((item) => Number(item.currentStock || 0) <= 0);
            const topProduct = buildTopProduct(state.transactions);
            const categories = buildCategoryStats(state.items);

            overviewContainer.innerHTML = [
                {
                    title: 'Total Stok Produk',
                    value: formatNumber(state.items.length),
                    note: `${formatNumber(categories.length)} kategori aktif`,
                    icon: 'fa-box',
                    iconStyle: 'background:#f6eee3;color:#8a5a34;',
                    target: 'stok-management-panel'
                },
                {
                    title: 'Stok Menipis',
                    value: formatNumber(lowStockItems.length),
                    note: 'Produk',
                    icon: 'fa-triangle-exclamation',
                    iconStyle: 'background:#fff3ef;color:#e16b34;',
                    target: 'stok-low-stock-panel',
                    link: 'Lihat detail',
                    stockView: 'low'
                },
                {
                    title: 'Stok Habis',
                    value: formatNumber(outOfStockItems.length),
                    note: 'Produk',
                    icon: 'fa-circle-xmark',
                    iconStyle: 'background:#fdeceb;color:#c85349;',
                    target: 'stok-management-panel',
                    link: 'Lihat detail',
                    stockView: 'out'
                },
                {
                    title: 'Produk Terlaris',
                    value: topProduct ? escapeHtml(topProduct.namaItem) : 'Belum ada',
                    note: topProduct ? `${formatNumber(topProduct.qty)} terjual` : 'Belum ada transaksi',
                    icon: 'fa-award',
                    iconStyle: 'background:#fff4dd;color:#cf8f14;',
                    target: 'stok-activity-panel'
                }
            ].map((card) => `
                <article class="stok-card">
                    <div>
                        <h3>${card.title}</h3>
                        <strong>${card.value}</strong>
                        <span>${card.note}</span>
                        ${card.link ? `<button type="button" class="stok-card-link" data-scroll-target="${card.target}" data-stock-view="${card.stockView || 'all'}">${card.link} <i class="fas fa-arrow-right"></i></button>` : ''}
                    </div>
                    <div class="stok-card-icon" style="${card.iconStyle}"><i class="fas ${card.icon}"></i></div>
                </article>
            `).join('');
        };

        const renderCategoryChart = () => {
            const stats = buildCategoryStats(state.items);
            let scopedStats = state.chartScope === 'top5' ? stats.slice(0, 5) : stats;

            if (state.chartScope === 'all' && stats.length > 6) {
                const primary = stats.slice(0, 5);
                const remainingCount = stats.slice(5).reduce((sum, item) => sum + item.count, 0);
                scopedStats = primary.concat({
                    name: 'Lainnya',
                    count: remainingCount,
                    color: '#d7c2ab'
                });
            }

            const total = scopedStats.reduce((sum, item) => sum + item.count, 0) || 1;

            let currentPercent = 0;
            const segments = scopedStats.map((item) => {
                const start = currentPercent;
                const slice = (item.count / total) * 360;
                currentPercent += slice;
                return `${item.color} ${start}deg ${currentPercent}deg`;
            });

            donutElement.style.background = segments.length ? `conic-gradient(${segments.join(', ')})` : 'conic-gradient(#dcd8d2 0deg 360deg)';
            donutElement.querySelector('.stok-donut-label').innerHTML = `<strong>${formatNumber(total)}</strong><span>Item</span>`;

            legendElement.innerHTML = scopedStats.map((item) => `
                <div class="stok-legend-item">
                    <span class="stok-legend-color" style="background:${item.color};"></span>
                    <span>${escapeHtml(item.name)}</span>
                    <strong>${formatNumber(item.count)} Item</strong>
                </div>
            `).join('') || '<div class="stok-empty">Belum ada data kategori.</div>';
        };

        const renderLowStock = () => {
            const lowItems = state.items
                .filter((item) => Number(item.currentStock || 0) > 0 && Number(item.currentStock || 0) <= 5)
                .sort((left, right) => Number(left.currentStock || 0) - Number(right.currentStock || 0) || String(left.namaItem || '').localeCompare(String(right.namaItem || '')))
                .slice(0, 5);

            if (!lowItems.length) {
                lowStockList.innerHTML = '<div class="stok-empty">Tidak ada stok menipis saat ini.</div>';
                return;
            }

            lowStockList.innerHTML = lowItems.map((item) => `
                <div class="stok-mini-item">
                    <span class="stok-mini-icon"><i class="fas fa-box-open"></i></span>
                    <div class="stok-mini-copy">
                        <strong>${escapeHtml(item.namaItem || '-')}</strong>
                        <small>${escapeHtml(item.__lokasi || item.__kategori || '-')}</small>
                    </div>
                    <span class="stok-pill low">Stok: ${escapeHtml(String(item.currentStock || 0))}</span>
                </div>
            `).join('');
        };

        const renderActivities = () => {
            const transactionActivities = state.transactions
                .flatMap((transaction) => transaction.items.map((item) => ({
                    kind: 'negative',
                    createdAt: transaction.createdAt,
                    time: store.formatDateTime(transaction.createdAt),
                    label: 'Stok Keluar',
                    name: item.namaItem,
                    detail: transaction.invoiceNumber,
                    qty: `-${formatNumber(item.qty)} pcs`
                })));

            const incomingActivities = state.stockActivities.map((activity) => ({
                kind: Number(activity.quantity || 0) >= 0 ? 'positive' : 'negative',
                createdAt: activity.createdAt,
                time: store.formatDateTime(activity.createdAt),
                label: activity.type === 'stock-set'
                    ? 'Edit Stok'
                    : (activity.type === 'stock-create' ? 'Barang Baru' : 'Stok Masuk'),
                name: activity.namaItem,
                detail: activity.type === 'stock-set'
                    ? `${activity.lokasi || 'Penyesuaian lokal'} • ${formatNumber(activity.previousQuantity || 0)} menjadi ${formatNumber(activity.targetQuantity || 0)}`
                    : (activity.type === 'stock-create'
                        ? `${activity.lokasi || 'Penyesuaian lokal'} • stok awal ${formatNumber(activity.targetQuantity || 0)}`
                        : (activity.lokasi || 'Penyesuaian lokal')),
                qty: `${Number(activity.quantity || 0) >= 0 ? '+' : '-'}${formatNumber(Math.abs(Number(activity.quantity || 0)))} pcs`
            }));

            const activities = [...incomingActivities, ...transactionActivities]
                .sort((left, right) => new Date(right.createdAt) - new Date(left.createdAt))
                .slice(0, 5);

            if (!activities.length) {
                activityList.innerHTML = '<div class="stok-empty">Belum ada aktivitas stok terbaru.</div>';
                return;
            }

            activityList.innerHTML = activities.map((activity) => `
                <div class="stok-activity-item">
                    <div class="stok-activity-time">${escapeHtml(activity.time)}</div>
                    <div class="stok-activity-copy">
                        <strong>${escapeHtml(activity.label)}: ${escapeHtml(activity.name || '-')}</strong>
                        <small>${escapeHtml(activity.detail || '')}</small>
                    </div>
                    <div class="stok-activity-qty ${activity.kind}">${escapeHtml(activity.qty)}</div>
                </div>
            `).join('');
        };

        const renderCategoryOptions = () => {
            const categories = buildCategoryStats(state.items).map((item) => item.name);
            categoryFilter.innerHTML = `<option value="all">Semua Kategori</option>${categories.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('')}`;
            categoryFilter.value = state.categoryFilter;
        };

        const renderTable = () => {
            const filteredItems = getFilteredItems();
            const totalItems = filteredItems.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / state.pageSize));

            if (state.currentPage > totalPages) {
                state.currentPage = totalPages;
            }

            const startIndex = (state.currentPage - 1) * state.pageSize;
            const visibleItems = filteredItems.slice(startIndex, startIndex + state.pageSize);
            const from = totalItems ? startIndex + 1 : 0;
            const to = startIndex + visibleItems.length;

            const maxWindowStart = Math.max(1, totalPages - state.pageWindowSize + 1);
            if (state.pageWindowStart > maxWindowStart) {
                state.pageWindowStart = maxWindowStart;
            }
            if (state.currentPage < state.pageWindowStart) {
                state.pageWindowStart = state.currentPage;
            }
            if (state.currentPage >= state.pageWindowStart + state.pageWindowSize) {
                state.pageWindowStart = state.currentPage - state.pageWindowSize + 1;
            }

            if (!visibleItems.length) {
                tableWrapper.innerHTML = '<div class="stok-empty">Tidak ada barang yang cocok dengan filter saat ini.</div>';
            } else {
                tableWrapper.innerHTML = `
                    <table class="stok-table">
                        <colgroup>
                            <col class="code">
                            <col class="barcode">
                            <col class="name">
                            <col class="category">
                            <col class="stock">
                            <col class="cost">
                            <col class="price">
                            <col class="location">
                            <col class="actions">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Barcode</th>
                                <th>Nama Barang</th>
                                <th>Kategori</th>
                                <th>Stok</th>
                                <th>Harga Pokok</th>
                                <th>Harga Jual</th>
                                <th>Lokasi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${visibleItems.map((item) => `
                                <tr>
                                    <td>${escapeHtml(item.kodeItem || '-')}</td>
                                    <td><span class="stok-code">${escapeHtml(item.barcode || '-')}</span></td>
                                    <td>
                                        <div class="stok-name">${escapeHtml(item.namaItem || '-')}</div>
                                        <div class="stok-subtext">${escapeHtml(item.__path || '-')}</div>
                                    </td>
                                    <td>${escapeHtml(getCategoryLabel(item))}</td>
                                    <td>${getStockBadge(item.currentStock)}</td>
                                    <td>${escapeHtml(formatRupiah(item.hargaPokok))}</td>
                                    <td>${escapeHtml(formatRupiah(item.hargaJual))}</td>
                                    <td>${escapeHtml(item.__lokasi || '-')}</td>
                                    <td>
                                        <div class="stok-actions">
                                            <button type="button" class="stok-action-icon" data-table-action="edit" data-item-key="${escapeHtml(item.__itemKey)}" data-item-name="${escapeHtml(item.namaItem || '-') }" title="Edit stok barang">
                                                <i class="fas fa-pen"></i>
                                            </button>
                                            <button type="button" class="stok-action-icon delete" data-table-action="delete" data-item-key="${escapeHtml(item.__itemKey)}" data-item-name="${escapeHtml(item.namaItem || '-') }" title="Hapus barang">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                            <button type="button" class="stok-add-button" data-item-key="${escapeHtml(item.__itemKey)}" data-item-name="${escapeHtml(item.namaItem || '-')}">Tambah Stok</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            tableInfo.textContent = `Menampilkan ${from} - ${to} dari ${formatNumber(totalItems)} data`;

            const windowEnd = Math.min(totalPages, state.pageWindowStart + state.pageWindowSize - 1);
            const prevHidden = state.pageWindowStart <= 1 ? 'hidden' : '';
            const nextHidden = windowEnd >= totalPages ? 'hidden' : '';

            pagination.innerHTML = `
                <button type="button" class="nav ${prevHidden}" data-nav="prev-window" aria-label="Halaman sebelumnya">
                    <i class="fas fa-chevron-left"></i>
                </button>
                ${Array.from({ length: Math.max(0, windowEnd - state.pageWindowStart + 1) }, (_, index) => {
                    const page = state.pageWindowStart + index;
                    return `<button type="button" class="${page === state.currentPage ? 'active' : ''}" data-page="${page}">${page}</button>`;
                }).join('')}
                <button type="button" class="nav ${nextHidden}" data-nav="next-window" aria-label="Halaman selanjutnya">
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
        };

        const renderAll = () => {
            syncStockListModeLabel();
            renderOverview();
            renderCategoryChart();
            renderLowStock();
            renderActivities();
            renderCategoryOptions();
            renderTable();
        };

        const applyStockListMode = (mode) => {
            state.stockListMode = mode;
            state.currentPage = 1;
            state.pageWindowStart = 1;
            syncStockListModeLabel();
            renderTable();
        };

        const refreshStockView = async () => {
            const [items, transactions, stockActivities] = await Promise.all([
                store.getEffectiveItems(),
                Promise.resolve(store.getTransactions()),
                Promise.resolve(store.getStockActivities())
            ]);

            state.items = items.sort((left, right) => String(left.namaItem || '').localeCompare(String(right.namaItem || '')));
            state.transactions = transactions;
            state.stockActivities = stockActivities;
            renderAll();
        };

        const handleAddStock = async (button) => {
            const itemKey = button.dataset.itemKey;
            const itemName = button.dataset.itemName || 'barang';
            const rawQty = window.prompt(`Tambah stok untuk ${itemName}. Masukkan jumlah stok tambahan:`);
            if (rawQty === null) {
                return;
            }

            const qty = Number(rawQty);

            try {
                await store.addStock(itemKey, qty);
                setMessage(`Stok ${itemName} berhasil ditambah sebanyak ${qty}.`, 'success');
                await refreshStockView();
            } catch (error) {
                setMessage(error.message, 'error');
            }
        };

        const handleEditStockSubmit = async (event) => {
            event.preventDefault();

            const item = getItemByKey(state.editingItemKey);
            if (!item) {
                setEditError('Barang yang ingin diedit tidak ditemukan.');
                return;
            }

            const qty = Number(editQuantityInput.value);
            if (!Number.isFinite(qty) || qty < 0 || !Number.isInteger(qty)) {
                setEditError('Stok akhir harus berupa bilangan bulat 0 atau lebih besar.');
                return;
            }

            if (qty === Number(item.currentStock || 0)) {
                closeEditStockModal();
                setMessage(`Tidak ada perubahan stok untuk ${item.namaItem}.`, 'success');
                return;
            }

            try {
                await store.setStock(state.editingItemKey, qty);
                closeEditStockModal();
                setMessage(`Stok ${item.namaItem} berhasil diperbarui menjadi ${qty}.`, 'success');
                await refreshStockView();
            } catch (error) {
                setEditError(error.message);
            }
        };

        const handleAddItemSubmit = async (event) => {
            event.preventDefault();

            try {
                const item = await store.addCustomItem({
                    namaItem: addItemNameInput.value,
                    kodeItem: addItemCodeInput.value,
                    barcode: addItemBarcodeInput.value,
                    lokasi: addItemLocationInput.value,
                    kategori: addItemCategoryInput.value,
                    stok: addItemStockInput.value,
                    hargaPokok: addItemCostInput.value,
                    hargaJual: addItemPriceInput.value
                });

                closeAddItemModal();
                setMessage(`Barang baru ${item.namaItem} berhasil ditambahkan.`, 'success');
                state.searchQuery = item.namaItem;
                searchInput.value = item.namaItem;
                state.currentPage = 1;
                state.pageWindowStart = 1;
                await refreshStockView();
            } catch (error) {
                setAddItemError(error.message);
            }
        };

        const handleDeleteItem = async (button) => {
            const itemKey = button.dataset.itemKey || '';
            const itemName = button.dataset.itemName || 'barang';

            const confirmed = await window.showAppConfirm({
                title: 'Konfirmasi Hapus Barang',
                message: `${itemName} akan dihapus dari data stok. Lanjutkan?`
            });
            if (!confirmed) {
                return;
            }

            try {
                await store.deleteItem(itemKey);
                setMessage(`Barang ${itemName} berhasil dihapus dari data stok.`, 'success');
                await refreshStockView();
            } catch (error) {
                setMessage(error.message, 'error');
            }
        };

        searchButton.addEventListener('click', () => {
            clearMessage();
            state.searchQuery = searchInput.value;
            state.currentPage = 1;
            state.pageWindowStart = 1;
            renderTable();
        });

        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                clearMessage();
                state.searchQuery = searchInput.value;
                state.currentPage = 1;
                state.pageWindowStart = 1;
                renderTable();
            }
        });

        resetButton.addEventListener('click', () => {
            clearMessage();
            searchInput.value = '';
            state.searchQuery = '';
            state.categoryFilter = 'all';
            state.stockListMode = 'all';
            categoryFilter.value = 'all';
            state.currentPage = 1;
            state.pageWindowStart = 1;
            syncStockListModeLabel();
            renderTable();
        });

        categoryFilter.addEventListener('change', () => {
            state.categoryFilter = categoryFilter.value;
            state.currentPage = 1;
            state.pageWindowStart = 1;
            renderTable();
        });

        categoryScope.addEventListener('change', () => {
            state.chartScope = categoryScope.value;
            renderCategoryChart();
        });

        pagination.addEventListener('click', (event) => {
            const navButton = event.target.closest('[data-nav]');
            if (navButton) {
                if (navButton.dataset.nav === 'prev-window') {
                    state.pageWindowStart = Math.max(1, state.pageWindowStart - state.pageWindowSize);
                    state.currentPage = Math.min(state.currentPage, state.pageWindowStart + state.pageWindowSize - 1);
                }

                if (navButton.dataset.nav === 'next-window') {
                    const filteredItems = getFilteredItems();
                    const totalPages = Math.max(1, Math.ceil(filteredItems.length / state.pageSize));
                    state.pageWindowStart = Math.min(
                        Math.max(1, totalPages - state.pageWindowSize + 1),
                        state.pageWindowStart + state.pageWindowSize
                    );
                    if (state.currentPage < state.pageWindowStart) {
                        state.currentPage = state.pageWindowStart;
                    }
                }

                renderTable();
                return;
            }

            const button = event.target.closest('[data-page]');
            if (!button) {
                return;
            }

            state.currentPage = Number(button.dataset.page);
            renderTable();
        });

        overviewContainer.addEventListener('click', (event) => {
            const button = event.target.closest('[data-scroll-target]');
            if (!button) {
                return;
            }

            applyStockListMode(button.dataset.stockView || 'all');

            const target = document.getElementById(button.dataset.scrollTarget);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });

        tableWrapper.addEventListener('click', async (event) => {
            const visualAction = event.target.closest('[data-table-action]');
            if (visualAction) {
                const action = visualAction.dataset.tableAction;
                if (action === 'edit') {
                    clearMessage();
                    openEditStockModal(visualAction.dataset.itemKey || '');
                    return;
                }

                if (action === 'delete') {
                    clearMessage();
                    await handleDeleteItem(visualAction);
                    return;
                }

                return;
            }

            const button = event.target.closest('.stok-add-button');
            if (button) {
                handleAddStock(button);
            }
        });

        addItemButton.addEventListener('click', () => {
            clearMessage();
            openAddItemModal();
        });
        addItemForm.addEventListener('submit', handleAddItemSubmit);
        addItemCloseButton.addEventListener('click', closeAddItemModal);
        addItemCancelButton.addEventListener('click', closeAddItemModal);
        addItemModal.addEventListener('click', (event) => {
            if (event.target === addItemModal) {
                closeAddItemModal();
            }
        });
        editForm.addEventListener('submit', handleEditStockSubmit);
        editCloseButton.addEventListener('click', closeEditStockModal);
        editCancelButton.addEventListener('click', closeEditStockModal);
        editModal.addEventListener('click', (event) => {
            if (event.target === editModal) {
                closeEditStockModal();
            }
        });
        window.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') {
                return;
            }

            if (addItemModal.classList.contains('is-open')) {
                closeAddItemModal();
            }

            if (editModal.classList.contains('is-open')) {
                closeEditStockModal();
            }
        });

        window.addEventListener('enrekang-stock-data-updated', refreshStockView);

        (async () => {
            try {
                await refreshStockView();
            } catch (error) {
                tableWrapper.innerHTML = `<div class="stok-empty"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`;
            }
        })();
    })();
</script>
