<style>
    .report-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 18px 35px rgba(122, 80, 50, 0.08);
        padding: 24px;
        border: 1px solid rgba(122, 80, 50, 0.08);
    }

    .report-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 14px;
        margin: 20px 0;
    }

    .report-metric {
        padding: 18px;
        border-radius: 14px;
        background: #faf5ef;
        border: 1px solid #edddcc;
    }

    .report-metric strong {
        display: block;
        font-size: 24px;
        margin-top: 8px;
        color: #2f3136;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
    }

    .report-table th,
    .report-table td {
        padding: 12px 10px;
        border-bottom: 1px solid #eee1d3;
        text-align: left;
    }

    .report-table th:last-child,
    .report-table td:last-child {
        text-align: right;
        width: 1%;
        white-space: nowrap;
    }

    .report-delete-button {
        border: none;
        border-radius: 10px;
        width: 34px;
        height: 34px;
        cursor: pointer;
        background: #fff1f0;
        color: #c65348;
        border: 1px solid #f0c8c4;
    }

    .report-delete-button:hover {
        background: #ffe5e2;
    }
</style>

<div class="report-card">
    <h2 style="color: #333; margin-bottom: 8px;"><i class="fas fa-chart-bar" style="color: #7a5032;"></i> Laporan Penjualan</h2>
    <p style="color: #666; margin-bottom: 20px;">Pilih periode untuk melihat ringkasan omzet, laba kotor, dan barang terlaris.</p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
        <input id="report-start" type="date" style="padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px;">
        <span style="align-self: center; color:#666;">sampai</span>
        <input id="report-end" type="date" style="padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px;">
        <button id="report-run" style="background: linear-gradient(135deg, #8a5a34, #a86c1d); color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer;">Tampilkan Laporan</button>
    </div>

    <div id="report-metrics" class="report-grid"></div>
    <div id="report-top-items"></div>
</div>

<script src="app-store.js?v=20260725"></script>
<script>
    (() => {
        const store = window.EnrekangStore;
        const startInput = document.getElementById('report-start');
        const endInput = document.getElementById('report-end');
        const metricsContainer = document.getElementById('report-metrics');
        const topItemsContainer = document.getElementById('report-top-items');
        const reportDateFormatter = new Intl.DateTimeFormat('id-ID', {
            weekday: 'long',
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });

        const today = store.getLocalDateString();
        const monthStart = `${today.slice(0, 8)}01`;
        startInput.value = monthStart;
        endInput.value = today;

        function formatReportDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '-' : reportDateFormatter.format(date);
        }

        async function renderReport() {
            const report = await store.getReport(startInput.value, endInput.value);
            metricsContainer.innerHTML = [
                ['Omzet', store.formatRupiah(report.summary.totalOmzet)],
                ['Laba Kotor', store.formatRupiah(report.summary.labaKotor)],
                ['Transaksi', report.summary.totalTransaksi],
                ['Item Terjual', report.summary.totalItemTerjual]
            ].map(([label, value]) => `
                <div class="report-metric">
                    <span style="color:#725742; font-weight:600;">${label}</span>
                    <strong>${value}</strong>
                </div>
            `).join('');

            if (!report.lineItems.length) {
                topItemsContainer.innerHTML = '<div style="padding: 20px; text-align:center; color:#888; border:1px dashed #ddd; border-radius:12px;">Belum ada transaksi pada periode ini.</div>';
                return;
            }

            topItemsContainer.innerHTML = `
                <h3 style="margin: 22px 0 12px; color:#2f3136;">Daftar Transaksi Barang</h3>
                <table class="report-table">
                    <thead>
                        <tr><th>Nama Barang</th><th>Nama Pelanggan</th><th>Tanggal</th><th>Barcode</th><th>Qty</th><th>Omzet</th><th>Catatan</th><th></th></tr>
                    </thead>
                    <tbody>
                        ${report.lineItems.map(item => `
                            <tr>
                                <td>${item.namaItem}</td>
                                <td>${item.customerName || '-'}</td>
                                <td>${formatReportDate(item.createdAt)}</td>
                                <td>${item.barcode || '-'}</td>
                                <td>${item.qty}</td>
                                <td>${store.formatRupiah(item.omzet)}</td>
                                <td>${item.notes || '-'}</td>
                                <td>
                                    <button type="button" class="report-delete-button" data-transaction-id="${item.transactionId}" data-detail-id="${item.detailId}" title="Hapus item transaksi">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            topItemsContainer.querySelectorAll('[data-transaction-id][data-detail-id]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const confirmed = await window.showAppConfirm({
                        title: 'Konfirmasi Hapus Laporan',
                        message: 'Item transaksi ini akan dihapus permanen dari laporan dan data transaksi. Lanjutkan?'
                    });
                    if (!confirmed) {
                        return;
                    }

                    try {
                        await store.deleteTransactionItem(button.dataset.transactionId, button.dataset.detailId);
                        await renderReport();
                    } catch (error) {
                        window.alert(error.message);
                    }
                });
            });
        }

        document.getElementById('report-run').addEventListener('click', renderReport);
        renderReport();
    })();
</script>
